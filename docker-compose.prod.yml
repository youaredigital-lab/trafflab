# Продакшен на сервере из готовых образов GHCR (собирает CI):
#   IMAGE_PREFIX=ghcr.io/<owner>/trafficlab TAG=latest docker compose -f docker-compose.prod.yml up -d
name: trafficlab

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-trafficlab}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}-backend:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trafficlab}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MEDIA_MAX_MB: ${MEDIA_MAX_MB:-2048}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Kyiv}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${IMAGE_PREFIX}-frontend:${TAG:-latest}
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: backend:8000
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-2100m}
    ports:
      # Только локально: снаружи доступ идёт через TLS-прокси (Caddy/Traefik/nginx)
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  media:
