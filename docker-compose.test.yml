# Тесты в контейнерах: make test
#   docker compose -f docker-compose.test.yml run --rm backend-test
#   docker compose -f docker-compose.test.yml run --rm frontend-test
name: trafficlab-test

services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trafficlab_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend-test:
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db-test:5432/trafficlab_test
    depends_on:
      db-test:
        condition: service_healthy

  frontend-test:
    build:
      context: ./frontend
      target: test
